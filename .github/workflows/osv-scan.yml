name: OSV scan

on:
  schedule:
    - cron: "0 18 * * *"  # daily at 18:00 UTC = 03:00 JST next day
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install osv-scanner
        env:
          OSV_SCANNER_VERSION: "2.3.8"
        run: |
          curl -fsSL "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64" \
            -o /usr/local/bin/osv-scanner
          chmod +x /usr/local/bin/osv-scanner
          osv-scanner --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install orchestrator
        working-directory: tools/orchestrator
        run: pip install .

      - name: Scan and create Issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: orchestrator scan --target .
