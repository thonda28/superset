name: OSV remediate

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to remediate"
        required: true
        type: number

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  remediate:
    if: >-
      github.event_name == 'workflow_dispatch'
      || contains(github.event.issue.labels.*.name, 'osv-finding')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install orchestrator
        working-directory: tools/orchestrator
        run: pip install .

      - name: Remediate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          DEVIN_ORG_ID: ${{ secrets.DEVIN_ORG_ID }}
        run: >-
          orchestrator remediate --issue
          ${{ github.event_name == 'workflow_dispatch'
              && inputs.issue_number
              || github.event.issue.number }}
